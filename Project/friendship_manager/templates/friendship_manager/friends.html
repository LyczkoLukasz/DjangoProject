{% load static %}
{% load friendship_tags %}
<!DOCTYPE html>
<html>
<head>
    <title>Friends</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'home/style_friends.css' %}">
</head>
<body>
    {% block template %}
    {% include 'home/base/banner.html' %}

    <div id="con1" class="container-fluid">
        <div class="row">
            <div class="col-lg-2 col-3">

                    <a class="list-group-item list-group-item-action" data-bs-toggle="collapse" href="#collapseReceived" role="button" aria-expanded="false" aria-controls="collapseReceived">
                        Invites received </a>
                    <a class="list-group-item list-group-item-action" data-bs-toggle="collapse" href="#collapseSent" role="button" aria-expanded="false" aria-controls="collapseSent">

                    <a class="list-group-item list-group-item-action" data-bs-toggle="collapse" href="#collapseFriends" role="button" aria-expanded="false" aria-controls="collapseFriends">
                        Friends </a>
                </div>
            </div>
            <div class="col-lg-10 col-9">
                <div class="d-flex align-items-center">
                    <div class="collapse" id="collapseReceived" data-bs-parent="#con1">
                        {% getListOfReceivedInvitations request.user %}
                            <!--<div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">{{ friend.from_user }}</h5>
                                    <p class="card-text">Received Friends Invite</p>
                                    <a id="accept-button" href="#" class="btn btn-primary">Accept</a>
                                    <a id="decline-button" href="#" class="btn btn-primary">Decline</a>
                                </div>
                            </div>-->
                    </div>
                    <div class="collapse" id="collapseSent" data-bs-parent="#con1">
                        {% getListOfSendedInvitations request.user %}
                        <!--
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">{{ invite.to_user }}</h5>
                                    <p class="card-text">Sent Friends Invite</p>
                                </div>
                            </div>-->

                    </div>
                    <div class="collapse" id="collapseFriends" data-bs-parent="#con1">
                        {% getListOfFriends request.user %}
                        <!--{% if friend.to_user == request.user.id %}
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">{{ friend.from_user }}</h5>
                                    <p class="card-text">Friends</p>
                                </div>
                            </div>
                        {% else %}
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">{{ friend.to_user }}</h5>
                                    <p class="card-text">Friends</p>
                                </div>
                            </div>
                        {% endif %}-->
                    </div>
                     
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
