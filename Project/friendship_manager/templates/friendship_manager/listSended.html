{% load static %}
<ul>
    {% if friend_requests|length == 0 %}
        <li>No invites sent</li>

    {% else %}
        {% for friend_request in friend_requests %}
            <li><a class="btn" href="{% url 'profile' friend_request.to_user.id %}">{{ friend_request.to_user }}</a></li>
        {% endfor %}
    {% endif %}
</ul>
