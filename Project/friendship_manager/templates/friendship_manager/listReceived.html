{% load static %}
<ul>
    {% if friend_requests|length == 0 %}
        <li>No invites received</li>

    {% else %}
        {% for friend_request in friend_requests %}
            <li><a class="btn" href="{% url 'profile' friend_request.id %}" >{{ friend_request.from_user }}</a></li>
        {% endfor %}
    {% endif %}
</ul>
